name: Reputation identity cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reputation-identity-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete canonical identity alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('"alternateName": ["Joe Nasr", "Joseph Nasr"]','"alternateName": ["Joe Nasr", "Joe Ribal Nasr", "Joseph Ribal Nasr"]')
          s=s.replace('      "https://robomarket.ae/"\n','')
          s=s.replace('      "https://robomarket.ae/",\n','')
          s=s.replace('https://joe-nasr-signals.vercel.app/','https://joe-nasr-signals.vercel.app/v2/')
          # Preserve the portfolio canonical itself after the broad identity-link update.
          s=s.replace('<link rel="canonical" href="https://joe-nasr-signals.vercel.app/v2/joenasr-portfolio/">','<link rel="canonical" href="https://joenasriani.github.io/joenasr-portfolio/">')
          s=s.replace('<meta property="og:url" content="https://joe-nasr-signals.vercel.app/v2/joenasr-portfolio/">','<meta property="og:url" content="https://joenasriani.github.io/joenasr-portfolio/">')
          s=s.replace('Dubai-based multidisciplinary creative working across the GCC.','Dubai-based creative technologist working across the GCC.')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Joe Nasr Reputation Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Complete portfolio canonical identity cleanup"
          git push
