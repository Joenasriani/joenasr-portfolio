name: Reputation identity cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reputation-identity-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair portfolio JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://joe-nasr-signals.vercel.app/v2/v2/#joe-nasr','https://joe-nasr-signals.vercel.app/v2/#joe-nasr')
          s=s.replace('https://joe-nasr-signals.vercel.app/v2/v2/','https://joe-nasr-signals.vercel.app/v2/')
          s=s.replace('      "https://joe-nasr-signals.vercel.app/v2/",\n    ]','      "https://joe-nasr-signals.vercel.app/v2/"\n    ]')
          p.write_text(s)
          PY
      - name: Validate JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>',s,re.S)
          for b in blocks: json.loads(b)
          print(f'Validated {len(blocks)} JSON-LD block(s)')
          PY
      - name: Commit repair
        run: |
          git config user.name "Joe Nasr Reputation Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Repair portfolio canonical Person JSON-LD"
          git push
